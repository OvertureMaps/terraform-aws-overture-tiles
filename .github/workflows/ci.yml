name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # Format check
  # ────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-slim
    concurrency:
      group: fmt-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      - name: tofu fmt
        run: tofu fmt -check -recursive

  # ────────────────────────────────────────────
  # Validate – no provider credentials needed
  # ────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-slim
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      - name: tofu init (module root)
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

      - name: tofu init (example/complete)
        run: tofu init -backend=false
        working-directory: examples/complete

      - name: tofu validate (example/complete)
        run: tofu validate
        working-directory: examples/complete

  # ────────────────────────────────────────────
  # Unit tests – mocked provider, no AWS creds
  # ────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-slim
    needs: [fmt, validate]
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      - name: tofu init
        run: tofu init -backend=false

      - name: tofu test
        run: tofu test
        env:
          # No real AWS credentials — mock_provider handles everything.
          TF_CLI_ARGS_test: "-verbose"

  # ────────────────────────────────────────────
  # Lint
  # ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-slim
    needs: [validate]
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: latest

      - name: tflint init
        run: tflint --init

      - name: tflint
        run: tflint --recursive
